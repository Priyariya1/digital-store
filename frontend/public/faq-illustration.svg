  <text x="320" y="67" text-anchor="middle" font-size="24" fill="#6B7280">?</text>
  
  <circle cx="80" cy="100" r="20" fill="white" stroke="#E5E7EB"/>
  <text x="80" y="107" text-anchor="middle" font-size="24" fill="#6B7280">?</text>
  
  <circle cx="350" cy="150" r="20" fill="white" stroke="#E5E7EB"/>
  <text x="350" y="157" text-anchor="middle" font-size="24" fill="#6B7280">?</text>
  
  <circle cx="250" cy="40" r="20" fill="white" stroke="#E5E7EB"/>
